<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f1e3">
  <meta name="color-scheme" content="light">
  <title>Claudia &amp; Manuel — Il mazzo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <!-- Visore carta (galleria) -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar">
      <button class="icon-btn" id="v-prev" aria-label="Carta precedente">‹</button>
      <span id="v-count" class="v-count"></span>
      <button class="icon-btn" id="v-next" aria-label="Carta successiva">›</button>
      <button class="icon-btn close" id="v-close" aria-label="Chiudi">✕</button>
    </div>
    <div class="viewer-body" id="v-body"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
